<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background outer glow -->
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#1e3a8a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Main sphere gradient -->
    <radialGradient id="sphereGrad" cx="70%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b5bfd" />
      <stop offset="25%" stop-color="#2546e8" />
      <stop offset="60%" stop-color="#141e68" />
      <stop offset="85%" stop-color="#0b1038" />
      <stop offset="100%" stop-color="#060922" />
    </radialGradient>

    <!-- Ring border gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="80%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Outer rim gradient -->
    <linearGradient id="outerRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop shadow for inner circle -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring Base -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="url(#outerRim)" stroke-width="12" />
  
  <!-- Outer Glow Ring -->
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#ringGrad)" stroke-width="3.5" opacity="0.9" />

  <!-- Main Dark Blue Sphere -->
  <circle cx="250" cy="250" r="220" fill="url(#sphereGrad)" />

  <!-- Subtle Inner Ring Highlight -->
  <circle cx="250" cy="250" r="218" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.4" />

  <!-- Typography: AUDIO -->
  <text x="250" y="210" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="68" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#ffffff">
    AUDIO
  </text>

  <!-- Middle Soundwave & SYNC Group -->
  <g transform="translate(118, 240)">
    <!-- Soundwave bars -->
    <g fill="#ffffff">
      <rect x="0" y="24" width="3.5" height="10" rx="1.75" />
      <rect x="7" y="19" width="3.5" height="20" rx="1.75" />
      <rect x="14" y="22" width="3.5" height="14" rx="1.75" />
      <rect x="21" y="14" width="3.5" height="30" rx="1.75" />
      <rect x="28" y="7" width="3.5" height="44" rx="1.75" />
      <rect x="35" y="0" width="4" height="58" rx="2" />
      <rect x="43" y="10" width="3.5" height="38" rx="1.75" />
      <rect x="50" y="21" width="3.5" height="16" rx="1.75" />
      <rect x="57" y="16" width="3.5" height="26" rx="1.75" />
      <rect x="64" y="24" width="3.5" height="10" rx="1.75" />
    </g>

    <!-- SYNC Text -->
    <text x="86" y="47" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="4" 
          fill="#ffffff">
      SYNC
    </text>
  </g>

  <!-- Typography: R E N T A L -->
  <text x="250" y="348" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="18" 
        fill="#ffffff">
    RENTAL
  </text>
</svg>
